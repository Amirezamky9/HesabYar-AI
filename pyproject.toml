[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hesabyar"
version = "0.1.0"
description = "Deterministic Iranian accounting ledger and tax compliance engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "jdatetime>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hesabyar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
