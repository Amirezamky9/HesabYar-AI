# Canonical Iranian Payroll Component Matrix
# Version: 1.5.1
# Authority: Labor Law, Social Security Law, Direct Tax Law, Supreme Labor Council Decrees
schema_version: "1.1"
description: >
  Multi-axis classification matrix for standard Iranian payroll components.
  Augmented with effective-dated statutory legal rule references for each axis,
  strictly forbidding timeless boolean assumptions.

components:
  - code: "BASE_WAGE"
    name_fa: "مزد شغل / پایه"
    name_en: "Basic Job Wage"
    classification: "EARNING"
    formula_key: "daily_base_wage * worked_days"
    is_statutory: true
    axes:
      is_wage_base: true
      is_insurance_assessable: true
      is_taxable: true
      is_overtime_base: true
      is_night_base: true
      is_shift_base: true
      is_friday_base: true
      is_severance_base: true
      is_eidi_base: true
      is_leave_settlement_base: true
      is_employer_cost: false
    rule_references:
      wage_base_rule_ref: "RULE-LABOR-ART35-BASE-WAGE"
      insurance_assessability_rule_ref: "RULE-SSO-ART28-ASSESSABLE-WAGE"
      taxability_rule_ref: "RULE-TAX-ART83-TAXABLE-SALARY"
      overtime_base_rule_ref: "RULE-LABOR-ART59-OVERTIME-BASE"
      severance_base_rule_ref: "RULE-LABOR-ART24-SEVERANCE-BASE"
      eidi_base_rule_ref: "RULE-EIDI-1370-BONUS-BASE"
      leave_settlement_rule_ref: "RULE-LABOR-ART71-LEAVE-SETTLEMENT-BASE"
      employer_cost_rule_ref: null
    statutory_notes: "Labor Law Arts. 34-36; core wage base for all statutory multipliers."

  - code: "SENIORITY_BONUS"
    name_fa: "پایه سنوات"
    name_en: "Seniority Bonus"
    classification: "EARNING"
    formula_key: "daily_seniority_rate * worked_days"
    is_statutory: true
    axes:
      is_wage_base: true
      is_insurance_assessable: true
      is_taxable: true
      is_overtime_base: true
      is_night_base: true
      is_shift_base: true
      is_friday_base: true
      is_severance_base: true
      is_eidi_base: true
      is_leave_settlement_base: true
      is_employer_cost: false
    rule_references:
      wage_base_rule_ref: "RULE-LABOR-ART36-FIXED-WAGE"
      insurance_assessability_rule_ref: "RULE-SSO-ART28-ASSESSABLE-WAGE"
      taxability_rule_ref: "RULE-TAX-ART83-TAXABLE-SALARY"
      overtime_base_rule_ref: "RULE-LABOR-ART59-OVERTIME-BASE"
      severance_base_rule_ref: "RULE-LABOR-ART24-SEVERANCE-BASE"
      eidi_base_rule_ref: "RULE-EIDI-1370-BONUS-BASE"
      leave_settlement_rule_ref: "RULE-LABOR-ART71-LEAVE-SETTLEMENT-BASE"
      employer_cost_rule_ref: null
    statutory_notes: "Labor Law Art. 36; included in fixed wage (مزد ثابت) for workers with >1 year service."

  - code: "HOUSING_ALLOWANCE"
