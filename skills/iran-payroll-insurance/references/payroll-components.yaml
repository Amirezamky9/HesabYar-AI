      severance_base_rule_ref: null
      eidi_base_rule_ref: null
      leave_settlement_rule_ref: null
      employer_cost_rule_ref: null
    statutory_notes: >
      Subject to Social Security per SSO circulars. Tax-exempt under Administrative Court Rulings 1957 & 11257
      and INTA Circular 200/1401/10; dependent on annual Cabinet decree and annual Budget Law provisions.

