      total_owner_transactions) - closing_balance.total_equity
    expected: 0
    tolerance: 0.01
    severity: error
    message: "معادله اصلی حقوق مالکانه مطابقت ندارد"
    refs: [1.108]
  
  - id: EC002
    description: مانده تعدیل‌شده ابتدای دوره
    formula: >
      (opening_balance + retrospective_application + 
      retrospective_restatement) - adjusted_opening_balance
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مانده تعدیل‌شده ابتدای دوره مطابقت ندارد"
    refs: [1.108]
  
  - id: EC003
    description: مجموع سود و زیان جامع
    formula: (net_profit + other_comprehensive_income) - total_comprehensive_income
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مجموع سود و زیان جامع مطابقت ندارد"
    refs: [1.108]
  
  - id: EC004
    description: جمع معاملات با مالکان
    formula: >
      (capital_contributions - distributions_to_owners + 
      changes_in_ownership) - total_owner_transactions
    expected: 0
    tolerance: 0.01
    severity: error
    message: "جمع معاملات با مالکان مطابقت ندارد"
    refs: [1.108]

# ============================================
# قواعد صورت جریان‌های نقدی
# ============================================
cash_flow:
  - id: CF001
    description: تغییر خالص در نقد
    formula: >
      (net_cash_from_operating + net_cash_from_investing + 
      net_cash_from_financing) - net_change_in_cash
    expected: 0
    tolerance: 0.01
    severity: error
    message: "تغییر خالص در نقد مطابقت ندارد"
    refs: [2]
  
  - id: CF002
    description: مانده پایان
    formula: >
      (beginning_cash + net_change_in_cash + effect_of_exchange_rate) - 
      ending_cash
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مانده پایان مطابقت ندارد"
    refs: [2]
  
  - id: CF003
    description: مطابقت با ترازنامه
    formula: ending_cash - balance_sheet.cash_and_equivalents
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مانده پایان با ترازنامه مطابقت ندارد"
    refs: [2]
  
  - id: CF004
    description: جریان عملیاتی (روش غیرمستقیم)
    formula: >
      (profit_before_tax + depreciation + amortization + provisions + 
      impairment_losses + foreign_exchange_gains_losses + 
      gains_losses_on_disposal + change_in_receivables + 
      change_in_inventory + change_in_payables + 
      change_in_other_working_capital - income_tax_paid + 
      other_adjustments) - net_cash_from_operating
