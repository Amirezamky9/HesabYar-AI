    tolerance: 0.01
    severity: error
    message: "جریان عملیاتی (روش غیرمستقیم) مطابقت ندارد"
    applies_to: indirect_method
    refs: [2]
  
  - id: CF005
    description: معاملات غیرنقدی
    requirement: non_cash_transactions_disclosed
    severity: error
    message: "معاملات غیرنقدی بااهمیت باید افشا شوند"
    refs: [2]

# ============================================
# قواعد بین صورت‌ها (Cross-checks)
# ============================================
cross_checks:
  - id: XC001
    description: مطابقت سود خالص
    formula: income_statement.net_profit - equity_changes.net_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود خالص در صورت سود و زیان و تغییرات حقوق مالکانه مطابقت ندارد"
  
  - id: XC002
    description: مطابقت سایر اقلام OCI
    formula: >
      comprehensive_income.other_comprehensive_income - 
      equity_changes.other_comprehensive_income
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سایر اقلام OCI مطابقت ندارد"
  
  - id: XC003
    description: مطابقت مجموع سود و زیان جامع
    formula: >
      comprehensive_income.total_comprehensive_income - 
      equity_changes.total_comprehensive_income
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مجموع سود و زیان جامع مطابقت ندارد"
  
  - id: XC004
    description: مطابقت نقد و معادل‌های نقد
    formula: cash_flow.ending_cash - balance_sheet.cash_and_equivalents
    expected: 0
    tolerance: 0.01
    severity: error
    message: "نقد و معادل‌های نقد مطابقت ندارد"
  
  - id: XC005
    description: مطابقت حقوق مالکانه
    formula: balance_sheet.total_equity - equity_changes.closing_balance.total_equity
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مجموع حقوق مالکانه مطابقت ندارد"
  
  - id: XC-W01
    description: مطابقت استهلاک
    formula: income_statement.depreciation - cash_flow.depreciation
    expected: 0
    tolerance: 0.01
    severity: warning
    message: "استهلاک در صورت سود و زیان و جریان نقدی مطابقت ندارد"

