    formula: >
      (net_profit + subtotal_not_reclassified + subtotal_reclassified) - 
      total_comprehensive_income
    expected: 0
    tolerance: 0.01
    severity: error
    message: "مجموع سود و زیان جامع مطابقت ندارد"
    refs: [1.100]
  
  - id: CI002
    description: تفکیک مجموع سود و زیان جامع
    formula: >
      (owners_of_parent + non_controlling_interests) - 
      total_comprehensive_income
    expected: 0
    tolerance: 0.01
    severity: error
    message: "تفکیک مجموع سود و زیان جامع مطابقت ندارد"
    refs: [1.100]
  
  - id: CI003
    description: اقلام غیرقابل انتقال
    formula: reclassification_adjustments
    expected: 0
    tolerance: 0.01
    severity: error
    message: "اقلام گروه «غیرقابل انتقال» نباید تعدیل تجدید طبقه‌بندی داشته باشند"
    applies_to: items_not_reclassified
    refs: [1.101]

# ============================================
