materiality_thresholds:
  - id: MAT001
    description: اهمیت نسبت به سود قبل از مالیات
    formula: amount / profit_before_tax
    threshold: 0.05
    severity: info
    message: "قلم بااهمیت نسبت به سود"
  
  - id: MAT002
    description: اهمیت نسبت به کل دارایی‌ها
    formula: amount / total_assets
    threshold: 0.01
    severity: info
    message: "قلم بااهمیت نسبت به دارایی‌ها"
  
  - id: MAT003
    description: اهمیت نسبت به درآمد عملیاتی
    formula: amount / revenue
    threshold: 0.005
    severity: info
    message: "قلم بااهمیت نسبت به درآمد"
  
  - id: MAT004
    description: اهمیت نسبت به حقوق مالکانه
    formula: amount / total_equity
    threshold: 0.02
    severity: info
    message: "قلم بااهمیت نسبت به حقوق مالکانه"

