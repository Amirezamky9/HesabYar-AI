# ============================================
# قواعد صورت سود و زیان
# ============================================
income_statement:
  - id: IS001
    description: جمع هزینه‌ها (روش ماهیت)
    formula: >
      (raw_materials_consumed + employee_benefits + depreciation + 
      other_expenses - changes_in_inventory) - total_expenses
    expected: 0
    tolerance: 0.01
    severity: error
    message: "جمع هزینه‌ها مطابقت ندارد"
    applies_to: nature_of_expense
    refs: [1.96]
  
  - id: IS002
    description: سود عملیاتی (روش ماهیت)
    formula: (revenue + other_income - total_expenses) - operating_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود عملیاتی مطابقت ندارد"
    applies_to: nature_of_expense
    refs: [1.96]
  
  - id: IS003
    description: سود ناخالص (روش کارکرد)
    formula: (revenue - cost_of_goods_sold) - gross_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود ناخالص مطابقت ندارد"
    applies_to: function_of_expense
    refs: [1.97]
  
  - id: IS004
    description: سود عملیاتی (روش کارکرد)
    formula: >
      (gross_profit + other_income - selling_expenses - 
      administrative_expenses - other_expenses) - operating_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود عملیاتی مطابقت ندارد"
    applies_to: function_of_expense
    refs: [1.97]
  
  - id: IS005
    description: سود قبل از مالیات
    formula: (operating_profit - finance_costs + share_of_associates) - profit_before_tax
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود قبل از مالیات مطابقت ندارد"
    refs: [1.83]
  
  - id: IS006
    description: سود خالص
    formula: (profit_before_tax - tax_expense + discontinued_operations) - net_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "سود خالص مطابقت ندارد"
    refs: [1.83]
  
  - id: IS007
    description: تفکیک سود خالص
    formula: (owners_of_parent + non_controlling_interests) - net_profit
    expected: 0
    tolerance: 0.01
    severity: error
    message: "تفکیک سود خالص مطابقت ندارد"
    refs: [1.83]

# ============================================
