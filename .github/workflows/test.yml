name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run validator on sample data
        run: python scripts/validator.py tests/sample-data.json --format markdown

      - name: Run pytest tests
        run: python -m pytest tests/test_validator.py -v

      - name: Check metadata.json
        run: python scripts/check_metadata.py

      - name: Verify all SKILL.md files exist
        run: python scripts/verify_skill_files.py

  lint:
    name: Lint Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install flake8

      - name: Lint scripts (errors only)
        run: flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint scripts (warnings)
        run: flake8 scripts/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics