name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run validator on sample data
        run: |
          python scripts/validator.py tests/sample-data.json --format markdown
      
      - name: Check metadata.json
        run: |
          python -c "import json; data = json.load(open('metadata.json', encoding='utf-8')); print(f'Standards: {data[\"standards_count\"]}'); assert data['standards_count'] == 35"
      
      - name: Verify all SKILL.md files exist
        run: |
          python -c "
import json
from pathlib import Path
data = json.load(open('metadata.json', encoding='utf-8'))
missing = []
for std in data['standards']:
    slug = std['slug']
    skill = Path('standards') / slug / 'SKILL.md'
    if not skill.exists():
        missing.append(str(skill))
if missing:
    print('Missing files:')
    for m in missing:
        print(f'  - {m}')
    exit(1)
print(f'All {len(data[\"standards\"])} SKILL.md files found')
"

  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: |
          pip install flake8
      
      - name: Lint scripts
        run: |
          # Stop on syntax errors
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (don't fail)
          flake8 scripts/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics