name: CI

on:
  push:
    branches: [master, main, develop, "arch/**", "ralph/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  python-gates:
    name: Python gates (ruff, pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

  python-tests:
    name: Python tests (Postgres; live-Tryton tests skip)
    runs-on: ubuntu-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
      HESABYAR_DATABASE_URL: "postgresql+psycopg://hesabyar:hesabyar_pass@localhost:5432/hesabyar_test"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hesabyar
          POSTGRES_PASSWORD: hesabyar_pass
          POSTGRES_DB: hesabyar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hesabyar -d hesabyar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Alembic migration roundtrip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Contract + live-e2e tests skip when no trytond is reachable
      # (skip-when-unreachable fixtures). A trytond job lands separately.
      - name: Run test suite
        run: uv run pytest -q -p no:cacheprovider

      - name: Check metadata
        run: uv run python scripts/check_metadata.py

      - name: Verify skill files
        run: uv run python scripts/verify_skill_files.py

      - name: Legacy validator sample check
        run: uv run python scripts/validator.py tests/sample-data.json --format markdown

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (Next.js)
        run: pnpm run build 
